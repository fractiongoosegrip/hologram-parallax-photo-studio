[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hologram-parallax-photo-studio"
version = "0.6.3"
description = "AI holographic / parallax 3D photo generator for Windows desktop"
readme = "CONTRIBUTING.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "hologram-parallax-photo-studio contributors" }]
keywords = ["hologram", "parallax", "3d-photo", "depth-estimation", "lenticular", "looking-glass"]

dependencies = [
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.9",
    "Pillow>=10.3",
    "pydantic>=2.7",
    "tomli>=2.0; python_version < '3.11'",
    "onnxruntime>=1.18; platform_system == 'Windows'",
    "torch>=2.3; platform_system == 'Windows'",
    "imageio[ffmpeg]>=2.34",
    "tqdm>=4.66",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]
gpu = ["onnxruntime-gpu>=1.18"]
lenticular = ["numpy-stl>=3.1"]

[project.scripts]
hps = "hologram_studio.__main__:main"
hologram-studio = "hologram_studio.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"